# HTTP -> HTTPS
server {
    listen 80;
    server_name auth.emarket.com shop.emarket.com vendor.emarket.com;
    return 301 https://$host$request_uri;
}

# Auth client
server {
    listen 443 ssl;
    server_name auth.emarket.com;

	ssl_certificate /etc/nginx/certs/auth.emarket.com+3.pem;
    ssl_certificate_key /etc/nginx/certs/auth.emarket.com+3-key.pem;

    location / {
        # root /usr/share/nginx/html/auth;
        # try_files $uri /index.html;
        proxy_pass http://host.docker.internal:8010/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

