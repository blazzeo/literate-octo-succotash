# HTTP -> HTTPS
server {
    listen 80;
    server_name api.emarket.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.emarket.com;

	ssl_certificate /etc/nginx/certs/auth.emarket.com+3.pem;
    ssl_certificate_key /etc/nginx/certs/auth.emarket.com+3-key.pem;

    # --- AUTH SERVICE
    location /auth/ {
        proxy_pass http://host.docker.internal:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- CUSTOMERS SERVICE
    location /customers/ {
        proxy_pass http://host.docker.internal:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- VENDORS SERVICE
    location /vendors/ {
        proxy_pass http://host.docker.internal:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- BLOB SERVICE
    location /blob/ {
        proxy_pass http://host.docker.internal:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- GOODS SERVICE
    location /goods/ {
        proxy_pass http://host.docker.internal:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- ORDERS SERVICE
    location /orders/ {
        proxy_pass http://host.docker.internal:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- BLOCKCHAIN
    location /blockchain/ {
        proxy_pass http://host.docker.internal:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
		# CORS
		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
		add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
		# OPTIONS preflight
		if ($request_method = OPTIONS ) {
			add_header 'Access-Control-Max-Age' 1728000;
			add_header 'Content-Type' 'text/plain; charset=UTF-8';
			add_header 'Content-Length' 0;
			return 204;
		}
    }

    # --- KEYCLOAK
	location /keycloak/ {
		proxy_pass http://keycloak:8080/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Port 443;
		proxy_set_header X-Forwarded-Ssl on;
		proxy_set_header X-Forwarded-Server $host;
		proxy_set_header X-Forwarded-By $host;
		proxy_redirect off;
		proxy_buffering off;
		proxy_cookie_path / /keycloak/;
		proxy_cookie_domain .emarket.com .emarket.com;
		proxy_ssl_verify off;
		proxy_ssl_session_reuse off;
	}
}
